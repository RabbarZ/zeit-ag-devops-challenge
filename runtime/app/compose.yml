# App environment base services, one VM per environment. Tenant containers are started
# by the control plane's provisioner (services/tenant-provisioner/src/provision-tenant.ts), not by this file.
#
# Written to /opt/acme/compose.yml by cloud-init. /opt/acme/.env (written by bootstrap.sh) provides:
#   AZURE_CONTAINER_REGISTRY, REDIS_PASSWORD, LOKI_REMOTE_URL, ENV_SLUG,
#   IMAGE_TAG and SOLVER_IMAGE_REPO (set by the deploy workflow)
# /etc/caddy/.env provides the Azure DNS credentials used for wildcard certificates.

name: acme-app

services:
  caddy:
    image: ${AZURE_CONTAINER_REGISTRY}/caddy-azure:2
    container_name: acme-caddy
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - /etc/caddy:/etc/caddy
    env_file:
      - /etc/caddy/.env
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', '--no-check-certificate', 'https://localhost/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: ${AZURE_CONTAINER_REGISTRY}/redis:7-alpine
    container_name: acme-redis
    restart: always
    command: >-
      redis-server --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb --maxmemory-policy allkeys-lru
      --save "900 1" --save "300 10"
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  chrome:
    image: ${AZURE_CONTAINER_REGISTRY}/browserless-chrome:latest
    container_name: acme-chrome
    restart: always
    ports:
      - '3333:3000'
    environment:
      CONNECTION_TIMEOUT: '60000'
      MAX_CONCURRENT_SESSIONS: '10'

  solver:
    image: ${AZURE_CONTAINER_REGISTRY}/${SOLVER_IMAGE_REPO:-planning-solver}:${IMAGE_TAG:-latest}
    container_name: acme-solver
    restart: always
    ports:
      - '8090:8080'
    environment:
      JAVA_OPTS: '-Xms256m -Xmx1024m'
    deploy:
      resources:
        limits:
          memory: 2g

  alloy:
    image: ${AZURE_CONTAINER_REGISTRY}/grafana-alloy:latest
    container_name: acme-alloy
    restart: always
    user: '0:0'
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/acme/alloy/config.alloy:/etc/alloy/config.alloy:ro
    environment:
      LOKI_REMOTE_URL: ${LOKI_REMOTE_URL}
      ENV_SLUG: ${ENV_SLUG}

networks:
  default:
    name: acme-app

volumes:
  caddy_data:
  redis_data:
