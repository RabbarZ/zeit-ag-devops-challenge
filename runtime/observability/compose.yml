# Observability VM: Alloy receives OTLP from the apps and forwards it to Loki, Tempo and
# Prometheus. Grafana reads all three. Caddy terminates TLS for Grafana.
#
# Copied to /opt/acme/observability by the deploy workflow, next to ./alloy, ./loki, ./tempo,
# ./prometheus and ./grafana. Data lives on the logs disk mounted at /mnt/logs (created by cloud-init).
# .env in the same folder provides AZURE_CONTAINER_REGISTRY and GRAFANA_ADMIN_PASSWORD.

name: acme-observability

services:
  caddy:
    profiles: ['caddy']
    image: ${AZURE_CONTAINER_REGISTRY}/caddy-azure:2
    container_name: acme-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - /etc/caddy:/etc/caddy

  alloy:
    image: ${AZURE_CONTAINER_REGISTRY}/grafana-alloy:latest
    container_name: acme-alloy
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    ports:
      - '4317:4317'
      - '4318:4318'
      - '12345:12345'
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      # grafana/alloy has no wget or curl, so probe the port from bash.
      test: ['CMD', 'bash', '-c', 'echo > /dev/tcp/localhost/12345']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  loki:
    image: ${AZURE_CONTAINER_REGISTRY}/grafana-loki:3.3.2
    container_name: acme-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - '3100:3100'
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - /mnt/logs/loki:/loki
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3100/ready']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  tempo:
    image: ${AZURE_CONTAINER_REGISTRY}/grafana-tempo:2.6.1
    container_name: acme-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - '13200:3200'
      - '4319:4317'
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - /mnt/logs/tempo:/var/tempo
    healthcheck:
      # Distroless image: no shell and no wget.
      disable: true

  prometheus:
    image: ${AZURE_CONTAINER_REGISTRY}/prom-prometheus:v3.2.1
    container_name: acme-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /mnt/logs/prometheus:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: ${AZURE_CONTAINER_REGISTRY}/grafana-grafana:latest
    container_name: acme-grafana
    restart: unless-stopped
    ports:
      - '3030:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.planner.example
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor traceToMetrics
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - /mnt/logs/grafana:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  caddy_data:
